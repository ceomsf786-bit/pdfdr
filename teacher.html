<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>SNT PDF Annotator — Teacher</title>
  <link rel="stylesheet" href="viewer.css">
  <link rel="stylesheet" href="v310-backup.css">
  <link rel="stylesheet" href="v311-library.css">
  <link rel="stylesheet" href="v312-imageboards.css">
  <link rel="stylesheet" href="v315-ui.css">
</head>
<body data-mode="teacher">
  <main id="app">
    <header class="topbar">
      <div class="brand"><span class="logo">SNT</span><div><strong id="docTitle">SNT PDF Annotator</strong><small id="contextText">Teacher</small></div></div>
      <div class="top-actions">
        <button id="libraryBtn" class="btn compact">Library</button>
        <button id="copyStudentLink" class="btn compact">Copy student link</button>
        <button id="hookStudentsBtn" class="btn compact hook-btn" type="button" aria-pressed="true">🔗 Students hooked</button>
        <button id="exportPdf" class="btn compact">Export PDF</button>
        <button id="exportBoardsPdf" class="btn compact" type="button" title="Export only teacher note boards and image boards as a PDF">Export notes/boards</button>
        <button id="insertPdfBtn" class="btn compact" type="button" title="Insert all pages from a Google Drive PDF anywhere in this document">+ Insert Drive PDF</button>
        <button id="backupPdfBtn" class="btn compact" type="button" title="Export every SNT annotation, note and image item for this PDF into one backup file">Backup all</button>
        <button id="importBackupBtn" class="btn compact" type="button" title="Restore an SNT backup into this PDF">Import backup</button>
        <input id="backupFileInput" type="file" accept=".sntbackup,.zip,application/zip" hidden>
        <button id="fullscreenBtn" class="btn compact">Full screen</button>
        <button id="focusPdfBtn" class="btn compact">PDF focus</button>
        <button id="deleteBookPageBtn" class="btn compact danger hidden" type="button">Delete added page</button>
        <button id="insertBookPageBtn" class="btn compact primary">+ Insert Page</button>
        <button id="permanentNoteBtn" class="btn compact">📌 Permanent Note</button>
        <button id="signOutBtn" class="btn compact">Sign out</button>
      </div>
    </header>

    <section id="loginPanel" class="login-panel hidden">
      <form id="loginForm" class="login-card">
        <h2>Teacher sign in</h2>
        <label>Email<input id="emailInput" type="email" required autocomplete="username"></label>
        <label>Password<input id="passwordInput" type="password" required autocomplete="current-password"></label>
        <button class="btn primary" type="submit">Sign in</button>
        <small>Use your existing Supabase teacher account.</small>
      </form>
    </section>

    <section id="loading" class="center-message">Loading…</section>
    <section id="error" class="error hidden"></section>

    <section id="workspace" class="workspace teacher-workspace hidden">
      <section class="pdf-area">
        <aside id="toolRail" class="tool-rail tool-rail-inline" aria-label="Annotation tools">
        <button class="tool active" data-tool="pen">✎<span>Pen</span></button>
        <button class="tool" data-tool="highlighter">▰<span>Highlight</span></button>
        <button class="tool" data-tool="eraser">⌫<span>Erase</span></button>
        <button class="tool" data-tool="select">⌖<span>Select</span></button>
        <button class="tool" data-tool="text">T<span>Text</span></button>
        <button class="tool" data-tool="line">╱<span>Line</span></button>
        <button class="tool" data-tool="arrow">➜<span>Arrow</span></button>
        <button class="tool" data-tool="rect">□<span>Box</span></button>
        <button class="tool" data-tool="ellipse">○<span>Circle</span></button>
        <button class="tool" data-tool="hand">✋<span>Pan</span></button>
        <div class="rail-divider"></div>
        <label class="rail-label">Width<input id="widthInput" type="range" min="1" max="18" value="4"></label>
        <label class="rail-label">Colour<input id="colorInput" type="color" value="#1f2937"></label>
        <label class="rail-label" title="Fill new boxes/circles and the selected shape"><span>Fill shape</span><input id="shapeFillToggle" type="checkbox"></label>
        <label class="rail-label">Fill colour<input id="shapeFillColor" type="color" value="#fff59d"></label>
        <button id="undoBtn" class="tool">↶<span>Undo</span></button>
        <button id="redoBtn" class="tool">↷<span>Redo</span></button>
        <button id="deleteSelected" class="tool danger">×<span>Delete</span></button>
      </aside>
        <div class="pdf-controls">
          <button id="prevPage" class="btn compact">← Prev</button>
          <label class="page-box">Page <input id="pageInput" type="text" inputmode="decimal" value="1"> <span id="pageCount">/ 1</span></label>
          <button id="nextPage" class="btn compact">Next →</button>
          <span class="spacer"></span>
          <button id="zoomOut" class="btn compact">−</button>
          <button id="fitPage" class="btn compact">Fit width</button>
          <button id="zoomIn" class="btn compact">+</button>
        </div>
        <div id="pdfScroller" class="pdf-scroller">
          <div id="canvasWrap" class="canvas-wrap">
            <canvas id="pdfCanvas"></canvas>
            <canvas id="overlayCanvas"></canvas>
          </div>
        </div>
      </section>
    </section>

    <footer class="statusbar teacher-statusbar">
      <span id="statusText">Ready</span>
      <span class="teaching-flow" title="Suggested lesson rhythm">RECALL → TEACH → THINK → RETRIEVE → APPLY → DISCUSS → WRITE → RETRIEVE</span>
      <span id="liveText">Teacher live</span>
    </footer>

    <dialog id="libraryDialog" class="library-dialog">
      <form method="dialog" class="dialog-head"><strong>PDF Library</strong><button class="btn compact">Close</button></form>
      <section class="create-doc">
        <h3>Add Google Drive PDF</h3>
        <label>Title<input id="newTitle" placeholder="e.g. Grade 6 Term 3 Maths"></label>
        <label>Google Drive PDF link<input id="newDriveUrl" placeholder="https://drive.google.com/file/d/.../view"></label>
        <button id="createDocBtn" class="btn primary" type="button">Add PDF</button>
        <small>Drive sharing must be: Anyone with the link → Viewer.</small>
      </section>
      <div id="libraryList" class="library-list"></div>
    </dialog>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script type="module" src="v315-viewer-loader.js"></script>
  <script type="module" src="v310-backup.js"></script>
  <script type="module" src="v311-library.js"></script>
  <script type="module" src="v315-imageboards-loader.js"></script>
  <script type="module" src="v313-pdf-insert.js"></script>
  <script type="module" src="v315-board-tools.js"></script>
  <script type="module" src="v320-links.js"></script>

<button id="exitPdfFocusBtn" class="btn exit-pdf-focus hidden" type="button" aria-label="Exit PDF Focus">← Exit PDF Focus</button>
<div id="bookPage" class="book-page hidden">
  <div id="bookPageTitle" class="book-page-title" contenteditable="true">Inserted Page</div>
  <div id="bookNoteEditor" class="book-note-editor hidden"></div>
  <div id="bookImageHost" class="book-image-host hidden"></div>
</div>
<div id="permanentNoteModal" class="permanent-note-modal hidden" role="dialog" aria-modal="true">
 <div class="permanent-note-sheet">
  <div class="permanent-note-head"><input id="permanentNoteTitle" value="Permanent Note" ><button id="permanentNoteClose" class="btn compact">Close</button></div>
  <div id="permanentNoteEditor" class="permanent-note-editor"></div>
 </div>
</div>
</body>
</html>
