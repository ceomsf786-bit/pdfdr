<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>SNT PDF Viewer</title>
  <link rel="stylesheet" href="viewer.css">
</head>
<body data-mode="student">
  <main id="app">
    <header class="topbar student-topbar">
      <div class="brand">
        <span class="logo">SNT</span>
        <div><strong id="docTitle">SNT PDF</strong><small id="contextText">Opening textbook…</small></div>
      </div>
      <div class="top-actions">
        <button id="prevPage" class="btn compact">←</button>
        <label class="page-box"><input id="pageInput" type="number" min="1" value="1"> <span id="pageCount">/ 1</span></label>
        <button id="nextPage" class="btn compact">→</button>
        <button id="zoomOut" class="btn compact">−</button>
        <button id="fitPage" class="btn compact">Fit</button>
        <button id="zoomIn" class="btn compact">+</button>
        <button id="toggleBoard" class="btn compact" aria-expanded="true">Hide notes</button>
      </div>
    </header>

    <section id="loading" class="center-message">Opening secure textbook…</section>
    <section id="error" class="error hidden"></section>

    <section id="workspace" class="workspace student-workspace hidden">
      <section class="pdf-area"><div id="followHint" class="follow-hint">Teacher controls the page and position • pinch with 2 fingers to zoom</div>
        <div id="pdfScroller" class="pdf-scroller">
          <div id="canvasWrap" class="canvas-wrap">
            <canvas id="pdfCanvas"></canvas>
            <canvas id="overlayCanvas"></canvas>
          </div>
        </div>
      </section>

      <div id="studentSplit" class="splitter horizontal-splitter student-resize-bar" title="Drag to resize PDF and notepad"><span>⇅ DRAG TO RESIZE PDF / NOTEPAD ⇅</span></div>

      <aside id="boardPanel" class="board-panel student-board open">
        <div class="board-head">
          <div><strong id="boardTitleDisplay">Teacher Notepad</strong><div class="board-meta"><small id="boardLabel">Board 1</small><small id="boardScopeLabel" class="scope-pill">Permanent</small></div></div>
          <div class="board-nav">
            <button id="boardPrev" class="btn compact">←</button>
            <button id="boardNext" class="btn compact">→</button>
          </div>
        </div>
        <textarea id="boardText" class="board-text" readonly placeholder="Teacher notes will appear here."></textarea>
        <section class="image-section">
          <div class="image-toolbar">
            <strong>Images</strong>
            <span id="imageCounter">0 / 0</span>
            <button id="imagePrev" class="btn compact">←</button>
            <button id="imageNext" class="btn compact">→</button>
          </div>
          <div id="imageStage" class="image-stage"><span>No pasted image on this board.</span><img id="boardImage" class="hidden" alt="Teacher pasted note"></div>
        </section>
      </aside>
    </section>

    <footer class="statusbar"><span id="statusText">View only</span><span id="liveText">Live</span></footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script type="module" src="viewer.js"></script>
</body>
</html>
