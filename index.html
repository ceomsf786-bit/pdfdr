<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>SNT PDF Viewer</title>
  <link rel="stylesheet" href="viewer.css">
  <link rel="stylesheet" href="v312-imageboards.css">
  <link rel="stylesheet" href="v315-ui.css">
</head>
<body data-mode="student">
  <main id="app">
    <header class="topbar student-topbar">
      <div class="brand"><span class="logo">SNT</span><div><strong id="docTitle">SNT PDF</strong><small id="contextText">Opening textbook…</small></div></div>
      <div class="top-actions">
        <button id="prevPage" class="btn compact">←</button>
        <label class="page-box"><input id="pageInput" type="text" inputmode="decimal" value="1"> <span id="pageCount">/ 1</span></label>
        <button id="nextPage" class="btn compact">→</button>
          <input id="bookPageTitle" class="book-page-name hidden" type="text" maxlength="100" aria-label="Added page name" placeholder="Page name" readonly>
        <button id="zoomOut" class="btn compact">−</button>
        <button id="fitPage" class="btn compact">Fit</button>
        <button id="zoomIn" class="btn compact">+</button>
        <button id="togglePdf" class="btn compact" aria-expanded="true">Hide PDF</button>
        <button id="downloadPdfBtn" class="btn compact" type="button" title="Download the complete textbook and inserted PDF files">Download PDF</button>
        <button id="permanentNoteBtn" class="btn compact">📌 Permanent Note</button>
      </div>
    </header>

    <section id="loading" class="center-message">Opening secure textbook…</section>
    <section id="error" class="error hidden"></section>

    <section id="workspace" class="workspace student-workspace hidden">
      <section class="pdf-area"><div id="followHint" class="follow-hint">Hooked LIVE: follow teacher pages • You control zoom and can open Permanent Note</div>
        <div id="pdfScroller" class="pdf-scroller"><div id="canvasWrap" class="canvas-wrap"><canvas id="pdfCanvas"></canvas><canvas id="overlayCanvas"></canvas></div></div>
      </section>
    </section>

    <footer class="statusbar"><span id="statusText">View only</span><span id="liveText">Live</span></footer>
  </main>
  <script src="v319-pdf-cache-key.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script type="module" src="v315-viewer-loader.js"></script>
  <script type="module" src="v315-imageboards-loader.js"></script>
  <script type="module" src="v320-links.js"></script>

<div id="bookPage" class="book-page hidden">
  <div id="bookNoteEditor" class="book-note-editor hidden"></div>
  <div id="bookImageHost" class="book-image-host hidden"></div>
</div>
<div id="permanentNoteModal" class="permanent-note-modal hidden" role="dialog" aria-modal="true">
 <div class="permanent-note-sheet">
  <div class="permanent-note-head"><input id="permanentNoteTitle" value="Permanent Note" readonly><button id="permanentNoteClose" class="btn compact">Close</button></div>
  <div id="permanentNoteEditor" class="permanent-note-editor"></div>
 </div>
</div>
</body>
</html>
